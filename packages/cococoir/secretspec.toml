[project]
name = "cococoir-edge"
revision = "1.0"

[profiles.default]
DNS_ZONE_ID = { description = "Hetzner DNS zone id the edge's records live in", required = true }
DNS_ZONE_NAME = { description = "Hetzner DNS zone apex, e.g. interdim.net", required = true }
DNS_TOKEN = { description = "Hetzner DNS API token", required = true }
ROOT_DOMAIN = { description = "Root domain customer hostnames live under", required = true }
ADMIN_KEY_HASH = { description = "SHA-256 hex of the admin API key", required = true }

# Operator-side secrets, resolved by the provisioning scripts (not the edge
# binary). The typed loader only materializes [profiles.default], so these
# blocks are inert to the box. Scopes carve the profile per consumer:
# `token` for tofu (HCLOUD_TOKEN), `provision` for writing edge.env.
[providers]
# Provider root is relative to the toml's resolved location. When invoked
# through the repo-root symlink (./secretspec.toml) this resolves to the
# repo's remote-infra/.secrets. No `..` — secretspec's relative roots
# mishandle parent traversal, so keep provider roots at (or below) the
# toml's level. Only used by the provisioning scripts; inert to the edge
# binary (which reads default only).
provisioning_store = "file:./remote-infra/.secrets"

[profiles.provisioning]
HETZNER_TOKEN = { description = "Hetzner API token (cloud + DNS)", required = true, providers = ["provisioning_store"] }
ADMIN_KEY = { description = "Admin API key, 16-byte hex", type = "hex", generate = { bytes = 16 }, required = true, providers = ["provisioning_store"] }

[scopes.token]
secrets = ["HETZNER_TOKEN"]

[scopes.provision]
secrets = ["HETZNER_TOKEN", "ADMIN_KEY"]