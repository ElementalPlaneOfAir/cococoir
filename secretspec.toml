# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The ONE secretspec manifest for the fortress monorepo. Two consumers,
# two profiles (per https://secretspec.dev/concepts/profiles/):
#
#   [profiles.default]       — the edge/site BINARIES at runtime. Read via
#                              the SDK's CWD-walk (WorkingDirectory=/etc/fortress
#                              in prod, repo root in dev), values from the
#                              dotenv provider /etc/fortress/edge.env (written
#                              by provision-edge.sh). Profile name "default"
#                              matches the derive's fallback, so the binaries
#                              need no explicit profile selection.
#   [profiles.provisioning]  — the OPERATOR provisioning scripts (tofu +
#                              edge.env writing), resolved by the secretspec
#                              CLI from the age-encrypted SOPS store. Standalone
#                              (inherit = false): its secret set is unrelated to
#                              the runtime contract. Scopes carve it per
#                              consumer (per https://secretspec.dev/concepts/scopes/):
#                              `token` for tofu, `provision` for edge.env.
#
# The secret names WG_PRIVATE_KEY / REDIS_URL / SMTP_* appear in BOTH
# profiles — that is the documented profile pattern (same name, different
# provider route per environment), not a DRY violation. The violation this
# file fixes is the OLD TWO-FILE split (repo root + crates/controlplane),
# where the two copies could and did drift apart. One file, one contract.
#
# Relative provider roots resolve from THIS file's directory (the repo
# root), so the sops store stays at ./secrets/ — keep provider roots at or
# below the toml's level, no `..`.

[project]
name = "fortress-edge"
revision = "1.0"

# ── Edge/runtime contract (the binaries' dotenv) ───────────────────
# Values arrive via the SDK's dotenv provider (/etc/fortress/edge.env);
# the derive macro reads this profile at compile time to type the
# SecretSpec struct, the SDK re-reads it at runtime for validation.
[profiles.default]
DNS_ZONE_ID = { description = "Hetzner DNS zone id the edge's records live in", required = true }
DNS_ZONE_NAME = { description = "Hetzner DNS zone apex, e.g. proletariat.tech", required = true }
DNS_TOKEN = { description = "Hetzner DNS API token", required = true }
ROOT_DOMAIN = { description = "Root domain customer hostnames live under", required = true }
ADMIN_KEY_HASH = { description = "SHA-256 hex of the admin API key", required = true }
WG_PRIVATE_KEY = { description = "Shared edge wg0 private key (base64, 32 bytes) — identical on both nodes (ADR-029)", required = true }
REDIS_URL = { description = "Shared external coordination store (Redis URL; rediss:// for TLS) — the pair's single coordination point (ADR-029)", required = true }
SMTP_HOST = { description = "SMTP submission relay host for the Mailer (absent → console mailer)", required = false }
SMTP_PORT = { description = "SMTP submission port (STARTTLS; default 587)", required = false }
SMTP_USER = { description = "SMTP submission auth user", required = false }
SMTP_PASS = { description = "SMTP submission auth password", required = false }
MAIL_FROM = { description = "Envelope From (default accounts@<ROOT_DOMAIN>)", required = false }

# ── Operator provisioning (the sops store) ─────────────────────────
# Resolved by provision-edge.sh via `nix run .#secretspec -- export -P
# provisioning -S <scope>`. Never read by any compiled binary.
[providers]
provisioning_store = "sops://secrets/secrets.enc.yaml?age_recipients=age1m2w4k4rgnzdynx0s9xqvx7k66dfa4jv5q20hgxp6dcjjwz09mdlqqzgves"

[profiles.provisioning.defaults]
inherit = false

[profiles.provisioning]
HETZNER_TOKEN = { description = "Hetzner API token (cloud + DNS)", required = true, providers = ["provisioning_store"] }
ADMIN_KEY = { description = "Admin API key, 16-byte hex", type = "hex", generate = { bytes = 16 }, required = true, providers = ["provisioning_store"] }
# The edge's shared wg0 identity (ADR-029 / edge-ha T3): ONE keypair for
# both nodes, so a re-handshake to the survivor just works. Generated
# once via `wg genkey` (proper base64 WG format), persisted in the sops
# store, idempotent thereafter. Both nodes read the same value.
WG_PRIVATE_KEY = { description = "Shared edge wg0 private key (base64, wg genkey)", type = "command", generate = { command = "wg genkey" }, required = true, providers = ["provisioning_store"] }
# The pair's coordination store (ADR-029 / edge-ha T4): ONE shared
# external managed Redis, TLS (`rediss://default:TOKEN@host:6379`).
# Entered once into the store by the operator from the provider console
# (the TCP RESP endpoint, not the REST one); both nodes resolve the same
# URL, which is what makes the lease mutually exclusive.
REDIS_URL = { description = "Shared external coordination store URL (rediss://, TLS)", required = true, providers = ["provisioning_store"] }
# Outbound mail relay (the Mailer seam): optional — absent means the
# edge runs the console mailer (magic links print to the boot log).
# SMTP_PORT/MAIL_FROM are deliberately NOT in the store: the controlplane
# defaults to 587 STARTTLS and accounts@<ROOT_DOMAIN>, which is what a
# verified relay wants anyway.
SMTP_HOST = { description = "SMTP submission relay host (absent → console mailer)", required = false, providers = ["provisioning_store"] }
SMTP_USER = { description = "SMTP submission auth user", required = false, providers = ["provisioning_store"] }
SMTP_PASS = { description = "SMTP submission auth password", required = false, providers = ["provisioning_store"] }

[scopes.token]
secrets = ["HETZNER_TOKEN"]

[scopes.provision]
secrets = ["HETZNER_TOKEN", "ADMIN_KEY", "WG_PRIVATE_KEY", "REDIS_URL", "SMTP_HOST", "SMTP_USER", "SMTP_PASS"]