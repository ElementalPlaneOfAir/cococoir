[package]
name = "cococoir-controlplane"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cococoir-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
poem.workspace = true
poem-openapi.workspace = true
redis = { version = "0.27", features = ["tokio-comp"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
dashmap = "6"
secretspec = { version = "0.19.1", default-features = false }
secretspec-derive = "0.19"
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.11"
subtle = "2"
hex = "0.4"

[dev-dependencies]
poem = { workspace = true, features = ["test"] }
