[package]
name = "fortress-controlplane"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fortress-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
poem.workspace = true
poem-openapi.workspace = true
momenta = "0.3.3"
fortress-web-ui = { path = "../web-ui" }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
# Explicit so the binary can install the provider before any rustls
# client (redis rediss / reqwest) is built — rustls aborts otherwise.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
dashmap = "6"
secretspec = { version = "0.19.1", default-features = false }
secretspec-derive = "0.19"
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.11"
subtle = "2"
hex = "0.4"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
poem = { workspace = true, features = ["test"] }

[features]
# Default tiers: `cargo test -p fortress-controlplane` runs the pure
# L0/L1 surfaces only. The store-backed tier that requires a real
# Redis (the "inside a deployment" set) is behind this flag:
#   cargo test -p fortress-controlplane --features redis-tests
redis-tests = []
