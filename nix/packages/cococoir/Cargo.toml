[package]
name = "cococoir"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "cococoir"
path = "src/lib.rs"

[dependencies]
poem = "3"
poem-openapi = { version = "5", features = ["swagger-ui"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
askama = "0.16.0"
momenta = "0.3.3"
uuid = { version = "1.24.0", features = ["v4"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
bcrypt = "0.17"
rnix = "0.14"
rowan = "0.16"
redis = { version = "0.27", features = ["tokio-comp"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
dashmap = "6"
socket2 = "0.5"
libc = "0.2"

[dev-dependencies]
poem = { version = "3", features = ["test"] }
